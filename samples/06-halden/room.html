<style>
html,body{height:1080px;overflow:hidden}

.ov svg text{font:600 12px var(--display);letter-spacing:.12em;fill:#f3dfb8}
.sel{position:absolute;transform:translate(-50%,-100%);padding:14px 16px;width:250px}
.sel .tag{color:var(--brass2)}
.sel b{display:block;font:800 20px/1 var(--display);text-transform:uppercase;letter-spacing:-.01em;margin:8px 0 4px}
.sel span{font-size:12px;color:rgba(233,226,214,.65)}
.sel .acts{display:flex;gap:6px;margin-top:12px}
.sel .acts a{flex:1;height:34px;display:grid;place-items:center;border:1px solid rgba(233,226,214,.18)}

  <div class="h"><span class="tag">Collection 07</span><b style="font:800 26px/1 var(--display);letter-spacing:-.02em">6 / 7</b><span style="font-size:12px;color:rgba(233,226,214,.6)">pieces placed. Drag from the tray onto the floor.</span></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const F = Forma3D(THREE, { RoomEnvironment, RoundedBoxGeometry });

/* tray thumbnails, rendered once */
const PIECES = [['Orbe', 'Lounge chair', '€6,820', () => F.chair({ fabric: F.fabric('velvet', '#6a2320') }), 1, 1], ['Dune', '3-module sofa', '€24,000', () => F.sofa(), 1, 0], ['Monolith', 'Coffee table', '€8,400', () => F.table(), 1, 0], ['Halo', 'Floor lamp', '€3,200', () => F.lamp(), 1, 0], ['Pebble', 'Side table', '€1,900', () => F.side(), 1, 0], ['Totem', 'Cabinet', '€12,600', () => F.cabinet(), 1, 0], ['Ovum', 'Pouf', '€2,300', () => F.pouf(), 0, 0]];
const cams = { Dune: [[2.6, 2.4, 5.6], [0.0, 0.4, 0.2]], Halo: [[1.6, 1.8, 4.4], [0, 0.9, 0]], Totem: [[1.8, 1.6, 3.6], [0, 0.6, 0]] };
document.getElementById('tray').innerHTML = PIECES.map(p => {
  const c = cams[p[0]] || [[2, 1.5, 3], [0, 0.35, 0]];
  const url = F.snap(p[3], { w: 160, h: 160, cam: c[0], target: c[1], fov: 26, floor: false });
  return `<div class="it ${p[4] ? 'in' : ''} ${p[0] === 'Ovum' ? 'drag' : ''}"><img src="${url}" alt=""><div><b>${p[0]}</b><small>${p[2]}</small></div><span class="st"><i data-ic="${p[4] ? 'check' : 'plus'}"></i></span></div>`;
}).join('');
document.querySelectorAll('#tray [data-ic]').forEach(el => { el.outerHTML = `<svg class="ic" viewBox="0 0 24 24">${{ check: '<path d="m5 12 5 5L20 7"/>', plus: '<path d="M12 5v14M5 12h14"/>' }[el.dataset.ic]}</svg>`; });

/* ---- the room ---- */
const S = F.stage(document.getElementById('room'), { w: 1440, h: 1080, fov: 38, exposure: 1.0 });
S.env = 0.32;
const { scene, camera, renderer } = S;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
camera.position.set(3.3, 2.55, 6.9); camera.lookAt(-0.2, 0.75, -0.9);
const W = { x0: -3, x1: 6.5, z0: -2.6, z1: 8, h: 3.1 };
const floor = F.mesh(new THREE.PlaneGeometry(W.x1 - W.x0, W.z1 - W.z0), F.floor([3.2, 3.2]), false);
floor.rotation.x = -Math.PI / 2; floor.position.set((W.x0 + W.x1) / 2, 0, (W.z0 + W.z1) / 2); scene.add(floor);
const backMat = F.plaster('#2b4638', [3, 2]);
const back = F.mesh(new THREE.BoxGeometry(W.x1 - W.x0, W.h, 0.12), backMat); back.position.set((W.x0 + W.x1) / 2, W.h / 2, W.z0 - 0.06); scene.add(back);
const sideMat = F.plaster('#d6c6ae', [3, 2]);
const win = { z0: -1.75, z1: 0.35, y0: 0.5, y1: 2.7 };
const wallPart = (z0, z1, y0, y1) => { const m = F.mesh(new THREE.BoxGeometry(0.16, y1 - y0, z1 - z0), sideMat); m.position.set(W.x0 - 0.08, (y0 + y1) / 2, (z0 + z1) / 2); scene.add(m); };
wallPart(W.z0 - 0.12, win.z0, 0, W.h); wallPart(win.z1, W.z1, 0, W.h); wallPart(win.z0, win.z1, 0, win.y0); wallPart(win.z0, win.z1, win.y1, W.h);
const bronze = F.metal('bronze');
const bar = (w, h, d, x, y, z) => { const m = F.mesh(new THREE.BoxGeometry(w, h, d), bronze); m.position.set(x, y, z); scene.add(m); };
bar(0.06, 0.05, win.z1 - win.z0, W.x0 - 0.05, win.y0, (win.z0 + win.z1) / 2); bar(0.06, 0.05, win.z1 - win.z0, W.x0 - 0.05, win.y1, (win.z0 + win.z1) / 2);
bar(0.06, win.y1 - win.y0, 0.05, W.x0 - 0.05, (win.y0 + win.y1) / 2, win.z0); bar(0.06, win.y1 - win.y0, 0.05, W.x0 - 0.05, (win.y0 + win.y1) / 2, win.z1);
bar(0.05, win.y1 - win.y0, 0.035, W.x0 - 0.05, (win.y0 + win.y1) / 2, (win.z0 + win.z1) / 2);
bar(0.05, 0.035, win.z1 - win.z0, W.x0 - 0.05, 1.95, (win.z0 + win.z1) / 2);
// sky beyond the window
const skyC = document.createElement('canvas'); skyC.width = 8; skyC.height = 256; { const x = skyC.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, '#7f9cc0'); g.addColorStop(0.55, '#f6cf98'); g.addColorStop(0.8, '#f1a768'); g.addColorStop(1, '#8a5a3a'); x.fillStyle = g; x.fillRect(0, 0, 8, 256); }
const skyT = new THREE.CanvasTexture(skyC); skyT.colorSpace = THREE.SRGBColorSpace;
const sky = new THREE.Mesh(new THREE.PlaneGeometry(14, 7), new THREE.MeshBasicMaterial({ map: skyT, toneMapped: false })); sky.rotation.y = Math.PI / 2; sky.position.set(W.x0 - 4, 1.8, -0.7); scene.add(sky);
// skirting in brass
const sk = F.mesh(new THREE.BoxGeometry(W.x1 - W.x0, 0.06, 0.02), F.metal('brass')); sk.position.set((W.x0 + W.x1) / 2, 0.03, W.z0 + 0.01); scene.add(sk);
// artwork: a plaster disc relief with an oxblood sun
const art = new THREE.Group();
const frame = F.rbox(1.5, 1.05, 0.06, 0.01, F.wood('oak')); art.add(frame);
const canvasM = F.mesh(new THREE.PlaneGeometry(1.36, 0.91), F.plaster('#e9e2d6', [1, 1]), false); canvasM.position.z = 0.032; art.add(canvasM);
const sun = F.mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.03, 64), F.lacquer('#6a2320')); sun.rotation.x = Math.PI / 2; sun.position.set(0.18, 0.08, 0.05); art.add(sun);
const line = F.mesh(new THREE.BoxGeometry(0.9, 0.012, 0.012), F.metal('brass')); line.position.set(-0.1, -0.25, 0.05); art.add(line);
art.position.set(0.55, 1.95, W.z0 + 0.04); scene.add(art);

// rug
const rs = new THREE.Shape(); const rw = 3.1, rd = 2.2, rr = 0.35;
rs.moveTo(-rw / 2 + rr, -rd / 2); rs.lineTo(rw / 2 - rr, -rd / 2); rs.quadraticCurveTo(rw / 2, -rd / 2, rw / 2, -rd / 2 + rr); rs.lineTo(rw / 2, rd / 2 - rr); rs.quadraticCurveTo(rw / 2, rd / 2, rw / 2 - rr, rd / 2); rs.lineTo(-rw / 2 + rr, rd / 2); rs.quadraticCurveTo(-rw / 2, rd / 2, -rw / 2, rd / 2 - rr); rs.lineTo(-rw / 2, -rd / 2 + rr); rs.quadraticCurveTo(-rw / 2, -rd / 2, -rw / 2 + rr, -rd / 2);
const rg = new THREE.ExtrudeGeometry(rs, { depth: 0.018, bevelEnabled: false, curveSegments: 16 }); rg.rotateX(-Math.PI / 2);
const rugM = F.fabric('boucle', '#8f7c62', [0.9, 0.9]); rugM.sheen = 0.3;
const rug = F.mesh(rg, rugM, false); rug.position.set(0.25, 0.001, -0.75); scene.add(rug);

// furniture
const sofa = F.sofa({ fabric: F.fabric('boucle', '#e6ded0', [4, 2]), accent: F.fabric('velvet', '#b07a35') }); sofa.position.set(0.45, 0, -2.0); scene.add(sofa);
const table = F.table(); table.position.set(0.35, 0.02, -0.65); table.rotation.y = 0.12; scene.add(table);
const chair = F.chair({ fabric: F.fabric('velvet', '#6a2320') }); chair.position.set(-1.35, 0.02, 0.5); chair.rotation.y = 0.95; scene.add(chair);
const lamp = F.lamp(); lamp.position.set(2.45, 0, -2.15); scene.add(lamp);
const side = F.side(); side.position.set(2.25, 0.02, -1.15); scene.add(side);
const cab = F.cabinet(); cab.position.set(-2.25, 0, -2.25); cab.rotation.y = 0.0; scene.add(cab);
const lampL = new THREE.PointLight('#ffc77d', 3.2, 4.5, 2); lampL.position.set(2.45, 1.6, -2.0); scene.add(lampL);
// selection ring under the chair
const selRing = new THREE.Mesh(new THREE.RingGeometry(0.74, 0.77, 96), new THREE.MeshBasicMaterial({ color: '#f3d79b', transparent: true, opacity: 0.95, toneMapped: false }));
selRing.rotation.x = -Math.PI / 2; selRing.position.set(chair.position.x, 0.025, chair.position.z); scene.add(selRing);
const selFill = new THREE.Mesh(new THREE.CircleGeometry(0.74, 96), new THREE.MeshBasicMaterial({ color: '#e0c08a', transparent: true, opacity: 0.12, toneMapped: false, depthWrite: false }));
selFill.rotation.x = -Math.PI / 2; selFill.position.set(chair.position.x, 0.022, chair.position.z); scene.add(selFill);
// ghost pouf being dragged in from the tray
const ghost = F.pouf({ fabric: new THREE.MeshPhysicalMaterial({ color: '#e0c08a', transparent: true, opacity: 0.45, roughness: 0.4, emissive: '#5a4020', emissiveIntensity: 0.4 }) });
ghost.traverse(m => { if (m.isMesh) { m.castShadow = false; m.material = m.material.transparent ? m.material : new THREE.MeshPhysicalMaterial({ color: '#e0c08a', transparent: true, opacity: 0.4 }); } });
ghost.position.set(1.05, 0.32, 1.55); scene.add(ghost);

// light: low golden sun through the window
const sunL = new THREE.DirectionalLight('#ffc27a', 7.5);
sunL.castShadow = true; sunL.shadow.mapSize.set(2048, 2048); sunL.shadow.bias = -0.0006; sunL.shadow.normalBias = 0.02;
Object.assign(sunL.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 30 });
sunL.target.position.set(0.3, 0, -0.6); scene.add(sunL, sunL.target);
const setSun = v => {
  const a = THREE.MathUtils.lerp(-0.2, 1.2, v / 100), h = Math.sin(Math.PI * Math.min(v / 100 + 0.12, 1)) * 5 + 1.6;
  sunL.position.set(-8, h, -0.6 + Math.sin(a) * 4.5);
  const warm = new THREE.Color('#dfe8ff').lerp(new THREE.Color('#ffb46a'), Math.abs(v - 45) / 55);
  sunL.color.copy(warm); sunL.intensity = 5 + (v > 85 ? (100 - v) / 3 : 2.5);
  const mins = 8 * 60 + Math.round(v / 100 * 12 * 60), hh = String(mins / 60 | 0).padStart(2, '0'), mm = String(mins % 60).padStart(2, '0');
  document.getElementById('tv').textContent = `${hh}:${mm}`;
  document.getElementById('tl').textContent = v < 25 ? 'Morning' : v < 60 ? 'Midday' : v < 88 ? 'Golden hour' : 'Dusk';
};
document.getElementById('sun').oninput = e => setSun(+e.target.value);
setSun(72);
scene.add(new THREE.HemisphereLight('#f6e6cf', '#2a1d14', 0.55));
const fillL = new THREE.DirectionalLight('#9fb6d8', 0.6); fillL.position.set(4, 3, 5); scene.add(fillL);
const dust = F.dust({ n: 500, r: 1.6, y0: 0.2, y1: 2.6, size: 0.014, seed: 9 }); dust.position.set(-1.6, 0, -0.5); scene.add(dust);
// sun shaft volumes
const shaftMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: 'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'varying vec2 vUv;void main(){float a=.13*smoothstep(0.,.25,vUv.x)*smoothstep(1.,.6,vUv.x)*smoothstep(0.,.3,vUv.y)*smoothstep(1.,.7,vUv.y);gl_FragColor=vec4(vec3(1.,.78,.5)*a,a);}' });
for (let i = 0; i < 3; i++) {
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 0.7 + i * 0.25), shaftMat);
  sh.position.set(-1.45, 1.35 - i * 0.1, -0.75 + (i - 1) * 0.55); sh.rotation.set(0, 0, -0.62); sh.rotation.y = 0.0; scene.add(sh);
}

// walls swatches
const WALLS = [['Forest', '#2b4638'], ['Oxblood', '#5a1f1b'], ['Plaster', '#d9cbb6'], ['Ink', '#1f1d22'], ['Clay', '#a8664f']];
const walls = document.getElementById('walls');
walls.innerHTML = WALLS.map((w, i) => `<a class="${i ? '' : 'on'}" style="background:${w[1]}" title="${w[0]}" data-i="${i}"></a>`).join('');
walls.onclick = e => { const a = e.target.closest('a'); if (!a) return; [...walls.children].forEach(c => c.classList.toggle('on', c === a)); backMat.color.set(WALLS[+a.dataset.i][1]); };

// overlay: selection card, clearance line, dimension tag
const ov = document.getElementById('ov'), svg = document.getElementById('osvg');
const sel = document.createElement('div'); sel.className = 'sel glass';
sel.innerHTML = `<span class="tag">Selected · drag to move</span><b>Orbe lounge</b><span>Oxblood velvet · brushed brass · 92 × 84 × 74 cm</span><div class="acts"><a><svg class="ic" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></a><a><svg class="ic" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12"/><path d="M4 16V4h12"/></svg></a><a class="p">Configure ↗</a></div>`;
ov.appendChild(sel);
const snapTag = document.createElement('div'); snapTag.className = 'snap'; snapTag.textContent = '1.10 m clearance'; ov.appendChild(snapTag);
const cur = document.createElement('div'); cur.className = 'cursor room-cursor'; cur.innerHTML = 'Drop<br>to place'; ov.appendChild(cur);
const v = new THREE.Vector3();
const P = (x, y, z) => S.project(v.set(x, y, z));
S.tick.push(t => {
  selRing.material.opacity = 0.75 + Math.sin(t * 3) * 0.2;
  ghost.position.y = 0.3 + Math.sin(t * 2) * 0.04; ghost.rotation.y = t * 0.4;
  F.driftDust(dust, t);
  const top = P(chair.position.x, 1.12, chair.position.z);
  sel.style.left = top.x + 'px'; sel.style.top = (top.y - 6) + 'px';
  const a = P(chair.position.x + 0.55, 0.03, chair.position.z - 0.35), b = P(table.position.x - 0.72, 0.03, table.position.z + 0.1);
  snapTag.style.left = (a.x + b.x) / 2 + 'px'; snapTag.style.top = (a.y + b.y) / 2 + 'px';
  const g = P(ghost.position.x, 0, ghost.position.z), gt = P(ghost.position.x, ghost.position.y + 0.45, ghost.position.z);
  cur.style.left = (gt.x + 40) + 'px'; cur.style.top = (gt.y - 30) + 'px';
  // rotate handle arc around the selection ring
  const arc = []; for (let i = 0; i <= 24; i++) { const an = -0.2 + i / 24 * 1.6; const p = P(chair.position.x + Math.cos(an) * 0.95, 0.03, chair.position.z + Math.sin(an) * 0.95); arc.push(`${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`); }
  const h0 = P(chair.position.x + Math.cos(1.4) * 0.95, 0.03, chair.position.z + Math.sin(1.4) * 0.95);
  svg.innerHTML = `<path d="M${a.x},${a.y} L${b.x},${b.y}" stroke="#f3d79b" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="${a.x}" cy="${a.y}" r="4" fill="#f3d79b"/><circle cx="${b.x}" cy="${b.y}" r="4" fill="#f3d79b"/>
    <path d="${arc.join(' ')}" fill="none" stroke="#f3d79b" stroke-width="2"/><circle cx="${h0.x}" cy="${h0.y}" r="11" fill="#f3d79b"/><path d="M${h0.x - 4},${h0.y} a4 4 0 1 1 4 4" stroke="#140f0e" stroke-width="1.6" fill="none"/>
    <path d="M${g.x},${g.y} m-60,0 a60,22 0 1,0 120,0 a60,22 0 1,0 -120,0" fill="rgba(224,192,138,.12)" stroke="#e0c08a" stroke-dasharray="4 4"/>`;
});
S.start();
</script>
